name: Release

# Publishes to npm with provenance when a version tag (e.g. v0.1.0) is pushed.
# Setup (one time): either configure npm Trusted Publishing for this repo and
# workflow (recommended, no token needed), or add an NPM_TOKEN repository secret.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
